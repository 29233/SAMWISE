# @package _global_

# Model
model:
  _target_: models.base.EfficientBase
  image_encoder:
    _target_: models.sam2.modeling.backbones.image_encoder.ImageEncoder
    scalp: 0
    trunk:
      _target_: models.sam2.modeling.backbones.hieradet.Hiera
      embed_dim: 144
      num_heads: 2
      stages: [2, 6, 36, 4]
      global_att_blocks: [23, 33, 43]
      window_pos_embed_bkg_spatial_size: [7, 7]
      window_spec: [8, 4, 16, 8]
    neck:
      _target_: models.sam2.modeling.backbones.image_encoder.FpnNeck
      position_encoding:
        _target_: models.sam2.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 256
        normalize: true
        scale: null
        temperature: 10000
      d_model: 256
      backbone_channel_list: [1152, 576, 288, 144]
      fpn_top_down_levels: [2, 3]  # output level 0 and 1 directly use the backbone features
      fpn_interp_model: nearest
  text_encoder:
    _target_: fairseq.models.roberta.RobertaModel.from_pretrained
    model_name_or_path: 'pretrain/roberta.base'
  audio_encoder:
    _target_: models.torchvggish.vggish.VGGish2
    pretrained_vggish_model_path: '/18018998051/AVSegFormer/pretrained/vggish-10086976.pth'
    pretrained_pca_params_path: '/18018998051/AVSegFormer/pretrained/vggish_pca_params-970ea276.pth'
    freeze_audio_extractor: True
    preprocess_audio_to_log_mel: False
    postprocess_log_mel_with_pca: False
  text_tokenizer:
    _target_: transformers.RobertaTokenizerFast.from_pretrained
    pretrained_model_name_or_path: 'pretrain/roberta'
  interactor: # 特征交互层
    _target_: models.sam2.modeling.interactor.Interactor
    d_model: 256
    num_heads: 8
    num_layers: 6
  decoder:
    _target_: models.maskformer.meta_arch.mask_former_head.MaskFormerHead
    idx_features: ['res2', 'res3', 'res4', 'res5']
    channels: [256, 256, 256, 256]
    strides: [4, 8, 16, 32]
    ignore_value: 255
    num_classes: 2
    pixel_decoder:
      _target_: models.maskformer.msdeformattn.MSDeformAttnPixelDecoder
      idx_features: ['res2', 'res3', 'res4', 'res5']
      channels: [256, 256, 256, 256]
      strides: [4, 8, 16, 32]
      transformer_dropout: 0.0
      transformer_nheads: 8
      transformer_dim_feedforward: 1024
      transformer_enc_layers: 6
      conv_dim: 256
      mask_dim: 256
      norm: "GN"
      transformer_in_features: ["res3", "res4", "res5"]
      common_stride: 4
    loss_weight: 1.0
    transformer_in_feature: "multi_scale_pixel_decoder"
    transformer_predictor:
        _target_: models.maskformer.transformer_decoder.mask2former_transformer_decoder.MultiScaleMaskedTransformerDecoder
        in_channels: 256
        mask_classification: True
        num_classes: 2
        hidden_dim: 256
        num_queries: 100
        nheads: 8
        dim_feedforward: 2048
        dec_layers: 9
        pre_norm: False
        mask_dim: 256
        enforce_input_project: False
  image_size: 384
  audio_feature_dim: 128
  text_feature_dim: 768
  image_encoder_checkpoint: '/18018998051/SAMWISE/pretrain/sam2_image_encoder_weights.pth'